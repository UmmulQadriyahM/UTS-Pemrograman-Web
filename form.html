<!DOCTYPE html>
<html>
<head>
    <title>Tambah Data Siswa</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h2>UPTD SMPN 17 Pukkiseng</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="siswa.html">Data Siswa</a>
        <a href="index.html">Logout</a>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- TOPBAR -->
        <div class="topbar">
            <h2>Input Data Siswa</h2>
            <p>Silahkan isi data dengan benar</p>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <div class="form-card">

                <form>

                    <label>Nama Siswa</label>
                    <input type="text" placeholder="Masukkan nama siswa" required>

                    <label>NISN</label>
                    <input type="text" placeholder="Masukkan NISN" required>

                    <label>Kelas</label>
                    <select required>
                        <option value="">Pilih Kelas</option>
                        <option>7A</option>
                        <option>7B</option>
                        <option>7C</option>
                        <option>8A</option>
                        <option>8B</option>
                        <option>8C</option>
                        <option>9A</option>
                        <option>9B</option>
                        <option>9C</option>
                    </select>

                    <label>Jenis Kelamin</label>
                    <select required>
                        <option value="">Pilih Jenis Kelamin</option>
                        <option>Laki-laki</option>
                        <option>Perempuan</option>
                    </select>

                    <label>Alamat</label>
                    <input type="text" placeholder="Masukkan alamat" required>

                    <!-- 🔥 WAJIB ADA INI -->
                    <div class="button-group">
                        <button type="submit">Simpan Data</button>
                        <a href="siswa.html" class="btn-cancel">Batal</a>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
